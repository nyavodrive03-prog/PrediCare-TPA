services:
  db:
    image: pgvector/pgvector:pg16
    container_name: predicare-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
      POSTGRES_DB: predicare
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predicare"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: predicare-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: predicare
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-test}
      OLLAMA_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ollama
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf_cache:/models
      - ./data:/app/data
    ports:
      - "8501:8501"

volumes:
  pgdata:
  hf_cache: