name: CI - PrediCare TPA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            fastapi \
            uvicorn \
            pytest \
            httpx \
            pydantic \
            pydantic-settings \
            sqlalchemy \
            psycopg[binary] \
            python-dotenv \
            joblib \
            scikit-learn \
            xgboost \
            shap \
            python-jose[cryptography] \
            passlib[bcrypt] \
            python-multipart \
            email-validator \
            alembic
      - name: Run tests
        working-directory: ./backend
        run: |
          pytest tests/ -v